<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Tracklix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" type="image/png" href="assets/images/image.png">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    /* Google OAuth button */
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 12px 20px; border: 1.5px solid #e2e8f0;
      border-radius: 10px; background: #fff; color: #1e293b;
      font-family: 'DM Sans', sans-serif; font-size: .9rem; font-weight: 500;
      cursor: pointer; transition: background .15s, border-color .15s;
      text-decoration: none; margin-bottom: 8px;
    }
    .btn-google:hover { background: #f8fafc; border-color: #94a3b8; }
    .btn-google img { width: 18px; height: 18px; }
  </style>
</head>
<body class="auth-body">
  <div class="auth-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>
 
  <div class="auth-container">
    <div class="auth-card auth-card--wide">
      <div class="auth-brand">
        <div class="brand-icon brand-icon--img"><img src="assets/images/image.png" alt="Tracklix Logo" /></div>
        <span class="brand-name">Tracklix</span>
      </div>
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Start managing your finances smarter</p>
 
      <div id="regAlert" class="alert hidden"></div>
 
      <!-- Google OAuth -->
      <a href="http://localhost:5000/api/auth/google" class="btn-google">
        <img src="https://www.google.com/favicon.ico" alt="Google" />
        Sign up with Google
      </a>
 
      <div class="auth-divider"><span>or register with email</span></div>
 
      <form id="registerForm" class="auth-form" novalidate>
        <div class="form-row">
          <div class="field-group">
            <label for="regName">Full Name</label>
            <div class="input-wrap">
              <i class="fa-regular fa-user input-icon"></i>
              <input type="text" id="regName" placeholder="John Doe" required />
            </div>
            <span class="field-error" id="nameError"></span>
          </div>
          <div class="field-group">
            <label for="regEmail">Email Address</label>
            <div class="input-wrap">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="regEmail" placeholder="you@example.com" required />
            </div>
            <span class="field-error" id="emailError"></span>
          </div>
        </div>
 
        <div class="form-row">
          <div class="field-group">
            <label for="regPassword">Password</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="regPassword" placeholder="Min 8 characters" required />
              <button type="button" class="toggle-pw" id="togglePw1"><i class="fa-regular fa-eye"></i></button>
            </div>
            <div class="pw-strength" id="pwStrength">
              <div class="pw-bar"><div class="pw-fill" id="pwFill"></div></div>
              <span id="pwLabel"></span>
            </div>
            <span class="field-error" id="pwError"></span>
          </div>
          <div class="field-group">
            <label for="regConfirm">Confirm Password</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="regConfirm" placeholder="Repeat password" required />
              <button type="button" class="toggle-pw" id="togglePw2"><i class="fa-regular fa-eye"></i></button>
            </div>
            <span class="field-error" id="confirmError"></span>
          </div>
        </div>
 
        <div class="field-group">
          <label for="regCurrency">Preferred Currency</label>
          <div class="input-wrap">
            <i class="fa-solid fa-coins input-icon"></i>
            <select id="regCurrency">
              <option value="₹">₹ INR – Indian Rupee</option>
              <option value="$">$ USD – US Dollar</option>
            </select>
          </div>
        </div>
 
        <button type="submit" class="btn-primary" id="regBtn">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader hidden"><i class="fa-solid fa-spinner fa-spin"></i></span>
        </button>
      </form>
 
      <p class="auth-link">
        Already have an account? <a href="index.html">Sign in</a>
      </p>
    </div>
  </div>
 
  <script type="module">
    import { apiRegister } from './js/storage.js';
 
    function togglePw(btnId, inputId) {
      document.getElementById(btnId).addEventListener('click', () => {
        const el = document.getElementById(inputId);
        const icon = document.getElementById(btnId).querySelector('i');
        el.type = el.type === 'password' ? 'text' : 'password';
        icon.className = el.type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
      });
    }
    togglePw('togglePw1', 'regPassword');
    togglePw('togglePw2', 'regConfirm');
 
    // Password strength
    document.getElementById('regPassword').addEventListener('input', (e) => {
      const v = e.target.value;
      let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^a-zA-Z0-9]/.test(v)) score++;
      const fill  = document.getElementById('pwFill');
      const label = document.getElementById('pwLabel');
      const levels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
      const colors = ['', '#ef4444', '#f59e0b', '#06b6d4', '#10b981'];
      fill.style.width = (score * 25) + '%';
      fill.style.background = colors[score];
      label.textContent = levels[score] || '';
      label.style.color = colors[score];
    });
 
    function showAlert(msg, type = 'error') {
      const alert = document.getElementById('regAlert');
      alert.className = `alert alert-${type}`;
      alert.textContent = msg;
      alert.classList.remove('hidden');
    }
 
    function setLoading(loading) {
      const btn = document.getElementById('regBtn');
      btn.querySelector('.btn-text').classList.toggle('hidden', loading);
      btn.querySelector('.btn-loader').classList.toggle('hidden', !loading);
      btn.disabled = loading;
    }
 
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name     = document.getElementById('regName').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regConfirm').value;
      const currency = document.getElementById('regCurrency').value;
 
      if (!name || !email || !password || !confirm) {
        showAlert('All fields are required.'); return;
      }
      if (password.length < 8) {
        showAlert('Password must be at least 8 characters.'); return;
      }
      if (password !== confirm) {
        showAlert('Passwords do not match.'); return;
      }
 
      setLoading(true);
      try {
        await apiRegister({ name, email, password, currency });
        showAlert('Account created! Redirecting to dashboard…', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1200);
      } catch (err) {
        showAlert(err.message || 'Registration failed. Please try again.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>

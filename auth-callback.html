<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing you in… – Tracklix</title>
  <link rel="icon" type="image/png" href="assets/images/image.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,'DM Sans',sans-serif;
      background:linear-gradient(135deg,#f8fafc,#ede9fe);flex-direction:column;padding:16px}
    .card{background:#fff;border-radius:20px;padding:48px 40px;
      box-shadow:0 8px 40px rgba(79,70,229,.12);text-align:center;max-width:360px;width:100%}
    .logo{font-size:22px;font-weight:800;color:#4f46e5;letter-spacing:-.5px;margin-bottom:28px}
    .spinner{width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#4f46e5;
      border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
    @keyframes spin{to{transform:rotate(360deg)}}
    h2{font-size:1.1rem;font-weight:700;color:#1e293b;margin-bottom:8px}
    p{font-size:.85rem;color:#64748b;line-height:1.6}
    .error-icon{font-size:2.8rem;margin-bottom:16px}
    .btn{display:inline-block;margin-top:20px;padding:11px 28px;background:#4f46e5;
      color:#fff;border-radius:10px;text-decoration:none;font-weight:600;font-size:.9rem}
    #errorCard{display:none}
  </style>
</head>
<body>
  <div id="loadingCard" class="card">
    <div class="logo">Tracklix</div>
    <div class="spinner"></div>
    <h2>Completing Google Sign-In</h2>
    <p>Please wait a moment…</p>
  </div>
  <div id="errorCard" class="card">
    <div class="logo">Tracklix</div>
    <div class="error-icon">⚠️</div>
    <h2>Sign-In Failed</h2>
    <p id="errorMsg">Something went wrong. Please try again.</p>
    <a href="index.html" class="btn">Back to Login</a>
  </div>
 
  <script type="module">
    import { setToken, apiGetMe } from './js/storage.js';
 
    function showError(msg) {
      document.getElementById('loadingCard').style.display = 'none';
      document.getElementById('errorCard').style.display   = 'block';
      if (msg) document.getElementById('errorMsg').textContent = msg;
    }
 
    async function handleCallback() {
      const params = new URLSearchParams(window.location.search);
      const token  = params.get('token');
      const error  = params.get('error');
 
      if (error || !token) {
        showError(
          error === 'google_failed'
            ? 'Google sign-in was cancelled or failed. Please try again.'
            : 'No token received. Please try again.'
        );
        return;
      }
 
      // Store token immediately — this is the most critical step
      setToken(token, true);
 
      // Try to fetch user — non-fatal if fails, dashboard will retry
      try {
        await apiGetMe();
      } catch (err) {
        console.warn('Profile fetch failed, proceeding anyway:', err.message);
      }
 
      window.location.href = 'dashboard.html';
    }
 
    handleCallback();
  </script>
</body>
</html>

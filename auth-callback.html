<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signing you in… – Tracklix</title>
  <link rel="icon" type="image/png" href="assets/images/image.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-family: 'DM Sans', -apple-system, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      flex-direction: column; gap: 20px;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 48px 40px;
      box-shadow: 0 8px 40px rgba(0,0,0,.08); text-align: center;
      max-width: 360px; width: 90%;
    }
    .logo {
      font-size: 22px; font-weight: 800; color: #4f46e5;
      letter-spacing: -.5px; margin-bottom: 24px;
    }
    .spinner-wrap { margin-bottom: 20px; }
    .spinner {
      width: 48px; height: 48px; border: 4px solid #e2e8f0;
      border-top-color: #4f46e5; border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.15rem; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
    p { font-size: .85rem; color: #64748b; line-height: 1.6; }
    .error-icon { font-size: 2.5rem; margin-bottom: 16px; }
    .btn {
      display: inline-block; margin-top: 20px; padding: 11px 28px;
      background: #4f46e5; color: #fff; border-radius: 10px;
      text-decoration: none; font-weight: 600; font-size: .9rem;
    }
  </style>
</head>
<body>
  <div class="card" id="loadingCard">
    <div class="logo">Tracklix</div>
    <div class="spinner-wrap">
      <div class="spinner"></div>
    </div>
    <h2>Completing Google Sign-In</h2>
    <p>Please wait a moment while we set up your account…</p>
  </div>
 
  <div class="card" id="errorCard" style="display:none">
    <div class="logo">Tracklix</div>
    <div class="error-icon">⚠️</div>
    <h2>Sign-In Failed</h2>
    <p>Something went wrong with Google sign-in. Please try again.</p>
    <a href="index.html" class="btn">Back to Login</a>
  </div>
 
  <script type="module">
    import { setToken, apiGetMe } from './js/storage.js';
 
    const token = new URLSearchParams(window.location.search).get('token');
 
    if (!token) {
      document.getElementById('loadingCard').style.display = 'none';
      document.getElementById('errorCard').style.display = 'block';
    } else {
      try {
        // Store the JWT token from Google OAuth
        setToken(token, true);
        // Fetch and cache the user profile
        await apiGetMe();
        // Redirect to dashboard
        window.location.href = 'dashboard.html';
      } catch (err) {
        console.error('Auth callback error:', err);
        document.getElementById('loadingCard').style.display = 'none';
        document.getElementById('errorCard').style.display = 'block';
      }
    }
  </script>
</body>
</html>
